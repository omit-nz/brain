name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      LL_MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .model-cache
          key: ll-core-models-0.2.3
      - name: ONNX Runtime
        run: |
          case "${{ matrix.os }}" in
            macos-*) target=aarch64-apple-darwin ;;
            ubuntu-*) target=x86_64-unknown-linux-gnu ;;
            windows-*) target=x86_64-pc-windows-msvc ;;
          esac
          lib=$(scripts/fetch-ort.sh "$target" "$RUNNER_TEMP/ort")
          echo "ORT_DYLIB_PATH=$lib" >>"$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # The only lint that sees the Worker shell, which builds for wasm32 alone.
      - run: cargo clippy -p brain-usage --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build -p brain-usage --target wasm32-unknown-unknown --release --locked

  repo:
    runs-on: ubuntu-24.04
    steps:
      - name: repo_is_public
        run: |
          test "${{ github.repository }}" = "omit-nz/brain"
          test "${{ github.event.repository.private }}" = "false"

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: shellcheck scripts/*.sh
      - run: bash scripts/release-key.test.sh
      - run: bash scripts/install.test.sh

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --proto '=https' -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
