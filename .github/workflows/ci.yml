name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      LL_MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .model-cache
          key: ll-core-models-0.2.3
      - name: ONNX Runtime
        run: |
          case "${{ matrix.os }}" in
            macos-*) target=aarch64-apple-darwin ;;
            ubuntu-*) target=x86_64-unknown-linux-gnu ;;
            windows-*) target=x86_64-pc-windows-msvc ;;
          esac
          lib=$(scripts/fetch-ort.sh "$target" "$RUNNER_TEMP/ort")
          echo "ORT_DYLIB_PATH=$lib" >>"$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked

  # brain.pkg, unsigned, built from pkg/ and installed the way a person installs it: into the
  # runner's own home, with no admin password.
  pkg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --locked -p brain
      - name: Build, check and install
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/brain-0.0.1"
          mkdir -p "$release/lib"
          cp target/debug/brain "$release/"
          scripts/build-pkg.sh "$release" 0.0.1 "$RUNNER_TEMP/brain.pkg"
          pkgutil --expand "$RUNNER_TEMP/brain.pkg" "$RUNNER_TEMP/expanded"
          if lsbom "$RUNNER_TEMP/expanded/brain-component.pkg/Bom" | grep -q '/\._'; then
            echo "the payload carries ._ files" >&2
            exit 1
          fi
          installer -pkg "$RUNNER_TEMP/brain.pkg" -target CurrentUserHomeDirectory
          "$HOME/.local/bin/brain" --version
          test "$("$HOME/.local/bin/brain" install-dir)" = "$HOME/Library/Application Support/nz.omit.brain/bin/brain-current"
      # The release's signing script, against stub Apple tools; it needs macOS's packaging tools.
      - run: bash scripts/sign-macos.test.sh

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # The only lint that sees the Worker shell, which builds for wasm32 alone.
      - run: cargo clippy -p brain-usage --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build -p brain-usage --target wasm32-unknown-unknown --release --locked
      # What wrangler deploys: worker-build, pinned, must write the `main` wrangler.toml names.
      - name: worker-build
        run: |
          cargo install worker-build --version 0.9.0 --locked
          cd crates/brain-usage
          worker-build --release
          test -f build/index.js

  repo:
    runs-on: ubuntu-24.04
    steps:
      - name: repo_is_public
        run: |
          test "${{ github.repository }}" = "omit-nz/brain"
          test "${{ github.event.repository.private }}" = "false"

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: shellcheck scripts/*.sh pkg/scripts/postinstall
      - run: bash scripts/release-key.test.sh
      - run: bash scripts/install.test.sh
      - run: npm ci --ignore-scripts --prefix mcpb/tool
      - run: bash scripts/verify-mcpb.test.sh
      - run: python3 -I scripts/eval-search.test.py

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --proto '=https' -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
