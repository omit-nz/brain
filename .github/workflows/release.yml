name: release

# A tag v<version> builds one archive per target, signs the macOS build with omit's Developer ID
# and makes brain.pkg from it, signs every archive on Linux, attests every asset, and publishes
# them only after a brain built on macOS from the same tag has checked every signature.
# docs/release.md says how to cut, check and roll back a release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      LL_MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .model-cache
          key: ll-core-models-0.2.3
      - name: Version matches the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - name: Target
        run: |
          case "${{ matrix.os }}" in
            macos-*) target=aarch64-apple-darwin; exe=brain ;;
            ubuntu-*) target=x86_64-unknown-linux-gnu; exe=brain ;;
            windows-*) target=x86_64-pc-windows-msvc; exe=brain.exe ;;
          esac
          echo "TARGET=$target" >>"$GITHUB_ENV"
          echo "EXE=$exe" >>"$GITHUB_ENV"
      - run: cargo build --release --locked -p brain
      - name: Pack
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pack/brain-$VERSION"
          mkdir -p "$dir/lib"
          cp "target/release/$EXE" "$dir/"
          scripts/fetch-ort.sh "$TARGET" "$dir/lib" >/dev/null
          mkdir -p dist
          tar -czf "dist/brain-$VERSION-$TARGET.tar.gz" -C "$RUNNER_TEMP/pack" "brain-$VERSION"
      # The macOS archive is not a release asset until macos-sign has signed what it holds.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ startsWith(matrix.os, 'macos') && 'unsigned' || 'archive' }}-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # brain and its runtime library signed with omit's Developer ID and notarised, packed again as
  # the update archive, and brain.pkg signed, notarised and stapled. Its own job on a fresh runner,
  # the only one holding the Apple secrets; scripts/sign-macos.sh fails the tag when one is missing.
  macos-sign:
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos-15
          path: unsigned
      - name: Sign, notarise and staple
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          mkdir -p "$RUNNER_TEMP/unpack"
          tar -xzf "unsigned/brain-$version-aarch64-apple-darwin.tar.gz" -C "$RUNNER_TEMP/unpack"
          scripts/sign-macos.sh "$RUNNER_TEMP/unpack/brain-$version" "$version" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-macos-15
          path: |
            dist/*.tar.gz
            dist/brain.pkg
          if-no-files-found: error

  # The Claude Desktop extension: the macOS brain and a manifest whose args end in --hand-over, so
  # the bundled copy only ever hands over to the installed brain.
  mcpb:
    needs: macos-sign
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      # No credentials on disk before npm runs third-party code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-macos-15
          path: dist
      # Pack runs with no secret in its environment.
      - name: Pack
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          ext="$RUNNER_TEMP/ext"
          mkdir -p "$ext/server" "$RUNNER_TEMP/unpack" out
          tar -xzf "dist/brain-$version-aarch64-apple-darwin.tar.gz" -C "$RUNNER_TEMP/unpack"
          cp "$RUNNER_TEMP/unpack/brain-$version/brain" "$ext/server/brain"
          cp mcpb/icon.png "$ext/"
          jq --arg v "$version" '.version = $v' mcpb/manifest.json >"$ext/manifest.json"
          # The tool and its whole tree come from the committed lockfile, with no install scripts.
          npm ci --ignore-scripts --prefix mcpb/tool
          mcpb/tool/node_modules/.bin/mcpb pack "$ext" "out/brain-$version.mcpb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-unsigned
          path: out/*.mcpb
          if-no-files-found: error

  # Signing is its own job on a fresh runner, so nothing Pack's tool left behind (an npm cache, a
  # changed file) is on disk when the signing keys are.
  mcpb-sign:
    needs: mcpb
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb-unsigned
          path: out
      - name: Tool
        run: npm ci --ignore-scripts --prefix mcpb/tool
      - name: Sign
        env:
          MCPB_CERT: ${{ secrets.MCPB_CERT }}
          MCPB_KEY: ${{ secrets.MCPB_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCPB_CERT" || { echo "MCPB_CERT is not set, so this release cannot be signed" >&2; exit 1; }
          test -n "$MCPB_KEY" || { echo "MCPB_KEY is not set, so this release cannot be signed" >&2; exit 1; }
          umask 077
          keys=$(mktemp -d "$RUNNER_TEMP/mcpb-keys.XXXXXX")
          trap 'rm -rf "$keys"' EXIT
          printf '%s' "$MCPB_CERT" >"$keys/cert.pem"
          printf '%s' "$MCPB_KEY" >"$keys/key.pem"
          mcpb/tool/node_modules/.bin/mcpb sign "out/brain-${GITHUB_REF_NAME#v}.mcpb" -c "$keys/cert.pem" -k "$keys/key.pem"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: out/*.mcpb
          if-no-files-found: error

  sign:
    needs: [build, macos-sign, mcpb-sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb
          path: dist
      - name: zipsign
        run: cargo install zipsign --version 0.2.2 --locked
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY_PREVIOUS: ${{ secrets.RELEASE_SIGNING_KEY_PREVIOUS }}
        run: |
          set -euo pipefail
          umask 077
          keys=$(mktemp -d "$RUNNER_TEMP/keys.XXXXXX")
          trap 'rm -rf "$keys"' EXIT
          test -n "$RELEASE_SIGNING_KEY"
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d >"$keys/current"
          set -- "$keys/current"
          if [ -n "$RELEASE_SIGNING_KEY_PREVIOUS" ]; then
            printf '%s' "$RELEASE_SIGNING_KEY_PREVIOUS" | base64 -d >"$keys/previous"
            set -- "$@" "$keys/previous"
          fi
          for archive in dist/*.tar.gz; do
            zipsign sign tar "$archive" "$@" >/dev/null
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  # Build provenance for every asset, over its final bytes (zipsign and stapling both change
  # files), logged in Sigstore's public transparency log. The bundle is published as an asset so
  # `gh attestation verify --bundle` works without signing in to GitHub.
  attest:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: dist
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/brain.pkg
            dist/*.mcpb
      - name: Bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir bundle
          cp "$BUNDLE" "bundle/brain-${GITHUB_REF_NAME#v}.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation
          path: bundle/*.sigstore.json
          if-no-files-found: error

  draft:
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation
          path: dist
      - name: SHA256SUMS and release.json
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          cd dist
          sha256sum -- *.tar.gz *.mcpb brain.pkg "brain-$version.sigstore.json" >SHA256SUMS
          jq -n --arg v "$version" --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --rawfile sums SHA256SUMS '
            ($sums | split("\n") | map(select(. != "") | split("  "))) as $rows
            | def asset($name): $rows | map(select(.[1] == $name)) | first | { url: ($base + "/" + .[1]), sha256: .[0] };
            { version: $v, protocol: 1,
              targets: ($rows | map(select(.[1] | endswith(".tar.gz"))) | map({
                key: (.[1] | ltrimstr("brain-" + $v + "-") | rtrimstr(".tar.gz")),
                value: { url: ($base + "/" + .[1]), sha256: .[0] } }) | from_entries),
              pkg: asset("brain.pkg"),
              attestations: asset("brain-" + $v + ".sigstore.json") }' >release.json
          test "$(jq '.targets | length' release.json)" = 3
          jq -e '.pkg.sha256 and .attestations.sha256' release.json >/dev/null
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" dist/*

  verify:
    needs: draft
    runs-on: macos-15
    permissions:
      contents: write
    env:
      LL_MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .model-cache
          key: ll-core-models-0.2.3
      - name: The build carries a release key
        run: test "$(od -An -v -tx1 crates/brain/src/keys/release.pub | tr -d ' \n')" != "$(printf '%064d' 0)"
      - run: cargo build --release --locked -p brain
      - name: Check every asset as a client would
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --dir assets
          cd assets
          shasum -a 256 -c SHA256SUMS
          test "$(ls -- *.tar.gz | wc -l | tr -d ' ')" = 3
          for archive in *.tar.gz; do
            ../target/release/brain release-verify "$archive"
          done
          version=${GITHUB_REF_NAME#v}
          test -f "brain-$version.mcpb"
          mkdir signed
          tar -xzf "brain-$version-aarch64-apple-darwin.tar.gz" -C signed
          bash ../scripts/verify-mcpb.sh "brain-$version.mcpb" "signed/brain-$version/brain" "$version"
      - name: Check Apple's signatures and the attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          team=$(cat crates/brain/src/keys/team_id)
          cd assets
          pkgutil --check-signature brain.pkg | tee "$RUNNER_TEMP/pkgutil.txt"
          grep -q "Developer ID Installer: .* ($team)" "$RUNNER_TEMP/pkgutil.txt"
          spctl --assess --type install -vv brain.pkg 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
          xcrun stapler validate brain.pkg
          for f in "signed/brain-$version/brain" "signed/brain-$version/lib/libonnxruntime.dylib"; do
            codesign --verify --strict --test-requirement="=notarized" "$f"
            codesign --verify --strict -R="anchor apple generic and certificate leaf[subject.OU] = \"$team\"" "$f"
          done
          for f in *.tar.gz *.mcpb brain.pkg; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --bundle "brain-$version.sigstore.json" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
