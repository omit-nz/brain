[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.10"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/omit-nz/brain"

[workspace.dependencies]
ll-core = { version = "=0.2.3", features = ["bge"] }
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
jiff = { version = "0.2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
walkdir = "2"
tempfile = "3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a replayed score is the recorded one to the last bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
omit-agent-trace = "0.1"
toml = "0.9"
sha2 = "0.11"
globset = "0.4"
yaml-rust2 = "0.10"
regex = "1"
assert_cmd = "2"
self_update = { version = "=1.3.3", default-features = false, features = ["signatures", "archive-tar", "compression-tar-gz", "reqwest", "rustls", "github", "progress-bar"] }
zipsign-api = { version = "=0.2.2", default-features = false, features = ["sign-tar"] }
tar = "0.4"
libloading = "0.9"
flate2 = "1"
notify = "9"
notify-debouncer-full = "0.8"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt", "macros"] }
schemars = "1"
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
